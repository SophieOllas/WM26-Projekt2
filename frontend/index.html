<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="connection-bar">
        <span id="connection-status" role="status">Not connected</span>
        <button id="reconnect" type="button" hidden>Reconnect</button>
    </header>

    <main>
        <form id="login-form" class="login-panel">
            <h1>Sign in to chat</h1>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
            <p id="login-error" role="alert"></p>
        </form>

        <ul id="messages" aria-live="polite" hidden></ul>
    </main>

    <form id="form" action="" hidden>
        <input id="input" autocomplete="off" aria-label="Message">
        <button type="submit">Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>

</html>
